<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Cairn Player</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        #view { width: 100%; height: 100%; display: block; image-rendering: auto; }
        #error { position: absolute; inset: 0; display: none; padding: 40px; color: #e8e8ee;
                 font: 13px/1.6 monospace; white-space: pre-wrap; background: #141419; }
    </style>
</head>
<body>
    <canvas id="view"></canvas>
    <div id="error"></div>
    <script src="./player.js"></script>
</body>
</html>
