name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libnss3 libasound2t64
      - name: Install npm dependencies
        run: npm ci
      - name: Build engine, addon and renderer
        run: npm run build
      - name: Engine unit tests
        run: ./engine/build/cairn_engine_test
      - name: End-to-end smoke test
        run: npm test
      - name: Editor boots (headless autotest)
        run: |
          CAIRN_AUTOTEST=1 CAIRN_AUTOTEST_MS=8000 CAIRN_TEST_PROJECT= \
          xvfb-run -a ./node_modules/.bin/electron . --no-sandbox > electron.log 2>&1 || true
          ! grep -q "renderer-error" electron.log || (cat electron.log && exit 1)

  windows:
    runs-on: windows-latest
    continue-on-error: true   # MSVC dev-env wiring is best-effort on CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enter MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install npm dependencies
        run: npm ci
      - name: Build engine, addon and renderer
        run: npm run build
      - name: Engine unit tests
        run: node scripts/run-engine-tests.js
      - name: CLI end-to-end
        run: node test/cli.js

  # Visual Studio (the Windows generator) is a multi-config generator: without
  # pinned output directories it writes the library into engine/build/Release/
  # instead of engine/build/. Ninja Multi-Config reproduces that layout on Linux,
  # so this job covers the staging path the Windows job depends on.
  multi-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build
      - name: Install npm dependencies
        run: npm ci
      - name: Configure with a multi-config generator
        run: cmake -S engine -B engine/build -G "Ninja Multi-Config" -DCMAKE_BUILD_TYPE=Release
      - name: Build engine, addon and renderer
        run: npm run build
      - name: Build-script staging tests
        run: node test/build.js
      - name: Engine unit tests
        run: npm run test:engine
      - name: Addon loads the staged library
        run: node cli/index.js engine.version
